{% load i18n %}
<div class="mechora-password-wrapper max-w-2xl relative w-full" x-data="{ showPassword: false }">
    <input type="{{ widget.type }}" x-bind:type="showPassword ? 'text' : 'password'" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
    <button type="button" class="mechora-password-toggle-btn" x-on:click="showPassword = !showPassword" title="{% trans "Toggle password visibility" %}" aria-label="{% trans "Toggle password visibility" %}">
        <span class="material-symbols-outlined" x-text="showPassword ? 'visibility_off' : 'visibility'">visibility</span>
    </button>
</div>
